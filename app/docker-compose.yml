name: cineassemble

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cineassemble-enhanced:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_URL: https://${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env}
      ALLOWED_ORIGINS: https://${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env}
      TRUST_PROXY_HOPS: 1
      SESSION_COOKIE_SECURE: "true"
      DATABASE_URL: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DATA_ROOT: /app/data
      PRIVATE_STORAGE_ROOT: /app/data/private
      TEMP_ROOT: /app/data/tmp
      JOBS_DIR: /app/data/jobs
    command:
      - sh
      - -c
      - node server/db/migrate.js && exec node server/index.js
    volumes:
      - private_media:/app/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:3001/health/ready
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 45s
    networks:
      - backend
      - edge
    security_opt:
      - no-new-privileges:true

  worker:
    image: cineassemble-enhanced:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_URL: https://${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env}
      ALLOWED_ORIGINS: https://${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env}
      DATABASE_URL: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DATA_ROOT: /app/data
      PRIVATE_STORAGE_ROOT: /app/data/private
      TEMP_ROOT: /app/data/tmp
      JOBS_DIR: /app/data/jobs
    command:
      - sh
      - -c
      - node server/db/migrate.js && exec node server/worker.js
    volumes:
      - private_media:/app/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    read_only: true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
  private_media:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
